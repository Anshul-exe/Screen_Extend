# Deskflow server config - screen-extend setup
# Lenuks (main, this machine) with ARCH (laptop) to its RIGHT.
# Screen names MUST match each machine's hostname.


section: links
	Lenuks:
		right = ARCH
	ARCH:
		left = Lenuks
end

section: options
	# Require the cursor to rest at the edge briefly before crossing.
	# Stops accidental screen switches mid-typing.
	switchDelay = 250

	clipboardSharing = true
	# 16 MB: a 1920x1080 32-bit BMP is ~8 MB, well over the old 1 MB limit,
	# which silently dropped every screenshot.
	clipboardSharingSize = 16384

	relativeMouseMoves = false

	# Raised from 5000 on 2026-10-22. At 5000 the client declares the server
	# dead after 3x5s, and with one DIMM out this machine stalls longer than
	# that under swap. 15000 gives 45s. Put back to 5000 once the RAM is in.
	heartbeat = 15000

	# Keyboard-only screen switching. control+alt is unused across all 98
	# i3 bindings on both machines, so nothing is shadowed.
	keystroke(control+alt+h) = switchInDirection(left)
	keystroke(control+alt+l) = switchInDirection(right)

	# Pin the cursor to the current screen when heads-down.
	# NOT on control+alt+shift+l: that is one stray Shift away from the
	# switch-right binding above, and a mis-hit locks you out silently with
	# no on-screen feedback. That cost 3.5 hours on 2026-10-21. 'p' for pin.
	keystroke(control+alt+shift+p) = lockCursorToScreen(toggle)
end
